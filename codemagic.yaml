workflows:
  android-apk:
    name: SS OIL Client APK
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        SUPABASE_URL: https://rxpsezjtjqfksdxcxmuw.supabase.co
    scripts:
      - name: Create Android platform
        script: flutter create --platforms android --project-name ss_oil_client .
      - name: Allow HTTPS access in release APK
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>'+chr(10)+'    <application', 1)
          s=s.replace('android:label="ss_oil_client"', 'android:label="SS OIL Client"')
          p.write_text(s)
          PY
      - name: Install packages
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk