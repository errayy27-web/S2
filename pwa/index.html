<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd2026"><link rel="manifest" href="./manifest.webmanifest"><title>SS OIL Kasa</title>
<style>body{font:15px system-ui;background:#f5f5f5;margin:0;color:#222}header{background:#bd2026;color:white;padding:19px 16px;font-size:23px;font-weight:800}main{max-width:650px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #ddd}h2{margin:0 0 14px;font-size:19px}label{display:block;margin:10px 0 4px}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #ddd;box-sizing:border-box}input{width:100%}button{background:#bd2026;color:white;border:0;font-weight:700;cursor:pointer;margin:5px 3px 5px 0}.secondary{background:#555}.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.line b{color:#bd2026;text-align:right}small{color:#777}#status{padding:9px 0}#login[hidden],#app[hidden]{display:none}.muted{color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{width:100%}</style></head>
<body><header>⛽ SS OIL · Kasa</header><main>
<div id="status" aria-live="polite">Hazırlanıyor…</div>
<section id="login" class="card" hidden><h2>Giriş</h2><label>E-posta</label><input id="email" type="email" autocomplete="username"><label>Şifre</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">Giriş Yap</button></section>
<section id="app" hidden><div class="card"><label>Tarih</label><input id="day" type="date"><div><button id="reload">Güncelle</button><button class="secondary" id="sync">Geçmişi İndir</button><button class="secondary" id="signOut">Çıkış</button></div><small id="syncInfo"></small></div><div id="details"></div></section>
</main><script src="./app.js"></script></body></html>
